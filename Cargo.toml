[package]
name = "dsh-remote"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
prost = "0.14"
prost-types = "0.14"
ed25519-dalek = "2.2"
rand = "0.8"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.14"
